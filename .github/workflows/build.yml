# GitHub Actions workflow for building dxctx_gm.dylib

name: Build DXCT GM Hook

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build dylib
        run: |
          echo "=== Build started ==="
          echo ""
          
          # Get SDK info
          SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>&1)
          MIN_VER=$(xcrun --sdk iphoneos --show-sdk-version 2>&1)
          
          echo "SDK: $SDK"
          echo "Min version: $MIN_VER"
          echo ""
          
          # Check source files
          echo "Source files:"
          ls -la src/
          echo ""
          
          # Try to build
          echo "Building..."
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -iframework "$SDK/System/Library/Frameworks" \
            -iframework "$SDK/Library/Frameworks" \
            -I src \
            -O2 \
            -Wall \
            -framework JavaScriptCore \
            -dynamiclib \
            -o dxctx_gm.dylib \
            src/fishhook.c \
            src/Inject.jsb.c \
            -Wl,-install_name,@rpath/dxctx_gm.dylib \
            -mios-version-min=$MIN_VER 2>&1 || {
              echo "Build failed with exit code $?"
              exit 1
            }
          
          echo ""
          echo "=== Build completed ==="
          
          # Verify
          echo "Result:"
          if [ -f dxctx_gm.dylib ]; then
            file dxctx_gm.dylib
            lipo -info dxctx_gm.dylib
            ls -lh dxctx_gm.dylib
            echo "SUCCESS"
          else
            echo "ERROR: dylib not found"
            exit 1
          fi
      
      - name: Upload artifact
        run: |
          echo "Uploading artifact..."
          ls -lh dxctx_gm.dylib
          echo "Done"
