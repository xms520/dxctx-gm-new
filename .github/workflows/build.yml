name: Build DXCT GM Hook

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macOS-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Build dylib
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        MIN_VER=$(xcrun --sdk iphoneos --show-sdk-version)
        echo "SDK: $SDK"
        echo "MIN_VER: $MIN_VER"
        ls -la src/
        clang \
          -arch arm64 \
          -isysroot "$SDK" \
          -iframework "$SDK/System/Library/Frameworks" \
          -iframework "$SDK/Library/Frameworks" \
          -I src \
          -O2 \
          -Wall \
          -framework JavaScriptCore \
          -dynamiclib \
          -o dxctx_gm.dylib \
          src/fishhook.c \
          src/Inject.jsb.c \
          -Wl,-install_name,@rpath/dxctx_gm.dylib \
          -mios-version-min=$MIN_VER
        ls -la dxctx_gm.dylib
        file dxctx_gm.dylib
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dxctx_gm
        path: dxctx_gm.dylib
