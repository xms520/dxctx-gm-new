name: Build
on: push
jobs:
  build:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" -framework JavaScriptCore -dynamiclib -o dxctx_gm.dylib src/Inject.jsb.c src/fishhook.c
          ls -la dxctx_gm.dylib
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dxctx_gm
          path: dxctx_gm.dylib
