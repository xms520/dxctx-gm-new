name: Build DXCT GM Hook

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          ls -la src/
          
      - name: Build
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cd src
          echo "Building from src directory"
          clang -arch arm64 \
            -isysroot "$SDK" \
            -I. \
            -O2 \
            -framework JavaScriptCore \
            -dynamiclib \
            -o dxctx_gm.dylib \
            fishhook.c \
            Inject.jsb.c \
            -v 2>&1
          ls -la dxctx_gm.dylib
          file dxctx_gm.dylib
          
      - name: Verify
        run: |
          ls -la dxctx_gm.dylib
          file dxctx_gm.dylib
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dxctx_gm
          path: dxctx_gm.dylib
