name: Build DXCT GM (面板dylib + 可选重打包IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build dylib
      run: |
        echo "=== Building dxctx_gm.dylib v3.1 ==="
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK: $SDK"

        clang \
          -arch arm64 \
          -isysroot "$SDK" \
          -iframework "$SDK/System/Library/Frameworks" \
          -iframework "$SDK/Library/Frameworks" \
          -Isrc \
          -O2 \
          -mios-version-min=15.0 \
          -Wall \
          -fobjc-arc \
          -ObjC \
          -framework JavaScriptCore \
          -framework UIKit \
          -framework Foundation \
          -framework QuartzCore \
          -dynamiclib \
          -o dxctx_gm.dylib \
          src/Inject.jsb.c \
          src/Overlay.m \
          -Wl,-install_name,@rpath/dxctx_gm.dylib

        echo "=== Build Result ==="
        file dxctx_gm.dylib
        lipo -info dxctx_gm.dylib
        ls -lh dxctx_gm.dylib

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: dxctx_gm_v3_panel
        path: dxctx_gm.dylib
        retention-days: 30

    # ============ 可选: 硬注入主二进制并重打包完整 IPA ============
    - name: 清理磁盘释放空间 (macOS runner 缓存)
      run: |
        echo "=== 磁盘清理前 ==="
        df -h / | tail -1
        # 删除 Xcode 缓存与无用数据 (macOS runner 标准清理)
        sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes 2>/dev/null || true
        sudo rm -rf /Users/runner/Library/Caches/pip 2>/dev/null || true
        sudo rm -rf /Users/runner/.gradle/caches 2>/dev/null || true
        sudo rm -rf /Users/runner/.m2/repository 2>/dev/null || true
        sudo rm -rf /Users/runner/.npm/_cacache 2>/dev/null || true
        sudo rm -rf /Users/runner/.cocoapods 2>/dev/null || true
        sudo rm -rf /Users/runner/Library/Developer/Xcode/DerivedData 2>/dev/null || true
        sudo rm -rf /Users/runner/Library/Developer/CoreSimulator/Caches 2>/dev/null || true
        sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform 2>/dev/null || true
        sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/WatchSimulator.platform 2>/dev/null || true
        sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/TVSimulator.platform 2>/dev/null || true
        sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/AppleTVSimulator.platform 2>/dev/null || true
        # 清理 Xcode 内嵌文档/符号 (大)
        sudo rm -rf /Applications/Xcode.app/Contents/Developer/Documentation 2>/dev/null || true
        sudo rm -rf /Applications/Xcode.app/Contents/Developer/usr/share 2>/dev/null || true
        sudo rm -rf /Applications/Xcode.app/Contents/SharedFrameworks/DevToolsFoundation.framework 2>/dev/null || true
        echo "=== 磁盘清理后 ==="
        df -h / | tail -1

    - name: 下载游戏 IPA (从 secret)
      env:
        IPA_URL: ${{ secrets.IPA_URL }}
      run: |
        set -e
        echo "=== 下载游戏 IPA ==="
        if [ -z "$IPA_URL" ]; then
          echo "IPA_URL secret 未设置, 跳过重打包"
          touch /tmp/SKIP_REPACK
          exit 0
        fi
        mkdir -p input output
        curl -sL --retry 3 "$IPA_URL" -o input/game.ipa
        ls -lh input/game.ipa
        cp dxctx_gm.dylib input/dxctx_gm.dylib

    - name: 编译 insert_dylib 并硬注入重打包
      run: |
        set -e
        if [ -f /tmp/SKIP_REPACK ]; then echo "已跳过重打包"; exit 0; fi
        echo "=== 开始硬注入重打包 ==="
        # 1) 编译 insert_dylib
        git clone --depth 1 https://github.com/Matchluck/insert_dylib.git /tmp/id 2>/dev/null || \
        git clone --depth 1 https://github.com/Tyilo/insert_dylib.git /tmp/id 2>/dev/null
        (cd /tmp/id && make) 2>/dev/null || (cd /tmp/id && xcodebuild -scheme insert_dylib -configuration Release build 2>/dev/null) || true
        INS=$(find /tmp/id /Users/runner/Library/Developer/Xcode/DerivedData -type f -name "insert_dylib" -perm -111 2>/dev/null | head -1)
        if [ -n "$INS" ]; then cp "$INS" /tmp/insert_dylib && chmod +x /tmp/insert_dylib; echo "insert_dylib ready: $INS"; else echo "NO_INS (将回退 LSEnvironment)"; fi

        # 2) 解包 (用 ditto 更稳, 处理中文文件名与权限)
        mkdir -p Work && cd Work
        ditto -x -k ../input/game.ipa . 2>/dev/null || unzip -o -q ../input/game.ipa
        cd ..
        APP=$(find Work -maxdepth 2 -type d -name "*.app" | head -1)
        echo "APP=$APP"
        EXEC=$(python3 -c "import plistlib,sys; print(plistlib.load(open('$APP/Info.plist','rb')).get('CFBundleExecutable','xkcg-mobile'))")
        echo "EXEC=$EXEC"
        echo "--- 解包后磁盘 ---"
        df -h / | tail -1

        # 3) 放置 dylib
        mkdir -p "$APP/Frameworks"
        cp input/dxctx_gm.dylib "$APP/Frameworks/dxctx_gm.dylib"

        # 4) 硬注入 load command
        INJECTED=""
        if [ -x /tmp/insert_dylib ]; then
          /tmp/insert_dylib --weakall @rpath/dxctx_gm.dylib "$APP/$EXEC" "$APP/${EXEC}_x2" && mv "$APP/${EXEC}_x2" "$APP/$EXEC" && INJECTED=loadcmd
        fi
        if [ -z "$INJECTED" ]; then
          python3 -c "import plistlib; p='$APP/Info.plist'; f=open(p,'rb'); d=plistlib.load(f); f.close(); d.setdefault('LSEnvironment',{})['DYLD_INSERT_LIBRARIES']='@rpath/dxctx_gm.dylib'; f=open(p,'wb'); plistlib.dump(d,f); f.close(); print('回退 LSEnvironment 写入')"
          INJECTED=LSEnv
        fi
        echo "注入方式=$INJECTED"
        echo "--- 验证 (otool) ---"
        otool -l "$APP/$EXEC" | grep -A2 dxctx_gm.dylib || echo "(otool 未显示注入)"

        # 5) 移除旧签名
        rm -rf "$APP/_CodeSignature"
        rm -f "$APP/embedded.mobileprovision"
        codesign --remove-signature "$APP/$EXEC" 2>/dev/null || true

        # 6) 重打包
        (cd Work && zip -qry ../output/dxctx_gm_injected.ipa Payload)
        ls -lh output/dxctx_gm_injected.ipa

    - name: 上传注入版 IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: dxctx_gm_injected_ipa
        if-no-files-found: ignore
        path: output/dxctx_gm_injected.ipa
        retention-days: 30