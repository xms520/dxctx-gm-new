# GitHub Actions workflow for building dxctx_gm.dylib

name: Build DXCT GM Hook

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check SDK
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          xcode-select -p
          clang --version
          
      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          MIN_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          
          echo "Building with SDK: $SDK"
          echo "Min version: $MIN_VER"
          
          # List framework
          ls -la "$SDK/System/Library/Frameworks/JavaScriptCore.framework"
          
          # Build
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -iframework "$SDK/System/Library/Frameworks" \
            -I src \
            -O2 \
            -Wall \
            -framework JavaScriptCore \
            -dynamiclib \
            -o dxctx_gm.dylib \
            src/fishhook.c \
            src/Inject.jsb.c \
            -Wl,-install_name,@rpath/dxctx_gm.dylib \
            -mios-version-min=$MIN_VER
          
          echo "Build completed"
          file dxctx_gm.dylib
          lipo -info dxctx_gm.dylib
