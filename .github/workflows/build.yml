# GitHub Actions workflow for building dxctx_gm.dylib

name: Build DXCT GM Hook

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check files
        run: |
          echo "=== Source files ==="
          ls -la src/
          echo ""
          echo "=== fishhook.c size ==="
          wc -l src/fishhook.c
          echo "=== Inject.jsb.c size ==="
          wc -l src/Inject.jsb.c
          
      - name: Build
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          ls -la "$SDK/System/Library/Frameworks/JavaScriptCore.framework"
          
          echo "=== Building ==="
          clang -v 2>&1 || true
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -iframework "$SDK/System/Library/Frameworks" \
            -I src \
            -O2 \
            -framework JavaScriptCore \
            -dynamiclib \
            -o dxctx_gm.dylib \
            src/fishhook.c \
            src/Inject.jsb.c \
            2>&1 || echo "Build failed"
            
          echo "=== Result ==="
          file dxctx_gm.dylib 2>/dev/null || echo "dylib not found"
          lipo -info dxctx_gm.dylib 2>/dev/null || true
