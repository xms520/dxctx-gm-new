# GitHub Actions workflow for building dxctx_gm.dylib

name: Build DXCT GM Hook

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check files
        run: |
          echo "=== Source files ==="
          ls -la src/
          echo ""
          echo "=== fishhook.c ==="
          wc -l src/fishhook.c
          echo "=== Inject.jsb.c ==="
          wc -l src/Inject.jsb.c
          
      - name: Build dylib
        run: |
          # Get SDK path
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          
          # Check JavaScriptCore framework
          echo "=== Checking frameworks ==="
          ls "$SDK/System/Library/Frameworks/JavaScriptCore.framework" 2>/dev/null || echo "JavaScriptCore not found"
          ls "$SDK/Library/Frameworks/JavaScriptCore.framework" 2>/dev/null || echo "JavaScriptCore not found in Library"
          
          # List framework paths
          echo "=== Framework paths ==="
          xcrun --sdk iphoneos --find JavaScriptCore 2>/dev/null || true
          find "$SDK" -name "JavaScriptCore.framework" -type d 2>/dev/null | head -5
          
          # Build
          echo "=== Building ==="
          cd src
          clang -arch arm64 \
            -isysroot "$SDK" \
            -I. \
            -O2 \
            -framework JavaScriptCore \
            -dynamiclib \
            -o ../dxctx_gm.dylib \
            fishhook.c \
            Inject.jsb.c
          
          echo "=== Result ==="
          ls -la ../dxctx_gm.dylib
          file ../dxctx_gm.dylib
          lipo -info ../dxctx_gm.dylib
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dxctx_gm
          path: dxctx_gm.dylib
