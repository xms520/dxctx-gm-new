name: Build DXCT GM dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build dylib
      run: |
        echo "=== Building dxctx_gm.dylib v3.1 ==="
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK: $SDK"

        clang \
          -arch arm64 \
          -isysroot "$SDK" \
          -iframework "$SDK/System/Library/Frameworks" \
          -iframework "$SDK/Library/Frameworks" \
          -Isrc \
          -O2 \
          -mios-version-min=15.0 \
          -Wall \
          -fobjc-arc \
          -ObjC \
          -framework JavaScriptCore \
          -framework UIKit \
          -framework Foundation \
          -framework QuartzCore \
          -dynamiclib \
          -o dxctx_gm.dylib \
          src/Inject.jsb.c \
          src/fishhook.c \
          src/Overlay.m \
          -Wl,-install_name,@rpath/dxctx_gm.dylib

        echo "=== Build Result ==="
        file dxctx_gm.dylib
        lipo -info dxctx_gm.dylib
        ls -lh dxctx_gm.dylib

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: dxctx_gm_v3_panel
        path: dxctx_gm.dylib
        retention-days: 30