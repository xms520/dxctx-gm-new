# GitHub Actions workflow for building dxctx_gm.dylib

name: Build DXCT GM Hook

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -iframework "$SDK/System/Library/Frameworks" \
            -I src \
            -O2 \
            -framework JavaScriptCore \
            -dynamiclib \
            -o dxctx_gm.dylib \
            src/fishhook.c \
            src/Inject.jsb.c
          
          file dxctx_gm.dylib
