name: Build DXCT GM Hook

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cd src
          clang -arch arm64 -isysroot "$SDK" -I. -O2 -framework JavaScriptCore -dynamiclib -o ../dxctx_gm.dylib fishhook.c Inject.jsb.c
          ls -la ../dxctx_gm.dylib
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dxctx_gm
          path: dxctx_gm.dylib
